name: MCP Registry CI and Azure deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MCP registry
        uses: actions/checkout@v4
        with:
          path: streaik-mcp-registry

      - name: Checkout MCP catalog
        uses: actions/checkout@v4
        with:
          repository: Streaik/streaik-mcp-catalog
          path: streaik-mcp-catalog

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Test
        working-directory: streaik-mcp-registry
        run: |
          set -euo pipefail
          find . -name '*.Tests.csproj' -print0 |
            while IFS= read -r -d '' project; do
              dotnet test "$project" -c Release
            done

      - name: Publish registry
        working-directory: streaik-mcp-registry
        run: |
          dotnet publish samples/Streaik.Mcp.Registry.Sample/Streaik.Mcp.Registry.Sample.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -o artifacts/publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-registry
          path: streaik-mcp-registry/artifacts/publish/
          if-no-files-found: error

  deploy:
    needs: build-test-publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: streaik-production

    concurrency:
      group: mcp-registry-production
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mcp-registry
          path: publish

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish